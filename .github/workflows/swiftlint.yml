name: SwiftLint

# Runs on a free Linux runner: SwiftLint's lint mode needs no macOS SDK, and
# the official release ships a static Linux binary. Pinned by version AND
# sha256 (brew previously floated the version — this is stricter, not looser).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Reused as a release gate (release.yml calls this before building).
  workflow_call:

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

# The repo default is already read-only; stated here so a future settings
# change can't silently widen this workflow's token.
permissions:
  contents: read

env:
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d"

jobs:
  swiftlint:
    name: SwiftLint (report-only)
    # FORK GUARD: keeps the workflow from running in forks' own repositories
    # (guarding on the fork bit, not a repo name a rename would silently break).
    # PRs from forks INTO this repo still run (the event's repository is the base).
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint (pinned Linux binary)
        run: |
          set -euo pipefail
          curl -sSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | sha256sum -c -
          unzip -q swiftlint.zip -d swiftlint-bin
          chmod +x swiftlint-bin/swiftlint
          ./swiftlint-bin/swiftlint version

      - name: Run SwiftLint
        # Report-only: every rule in .swiftlint.yml is warning severity (see
        # CONTRIBUTING.md "Ground rules"), so this step must never fail a PR
        # while adoption is warning-only. continue-on-error guards against a
        # future config change accidentally introducing an `error` severity,
        # or against the lint runner itself crashing.
        continue-on-error: true
        run: ./swiftlint-bin/swiftlint lint --quiet --reporter github-actions-logging
