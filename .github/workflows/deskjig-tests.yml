name: DeskJigTests

# Runs the headless-safe DeskJigTests plan (TestPlans/DeskJigTests-Headless.xctestplan)
# on every PR. The headless plan contains only pure-logic suites and needs no
# Accessibility grant or GUI session — the test host launches DeskJig.app, but
# the app makes itself dormant under test (no hotkeys, no menu-bar item, no
# window), so nothing in this lane touches the runner's UI.
#
# The Full plan (real-system integration suites) and the CLI smoke suite are
# deliberately NOT run here: both need a real, AX-granted user session. They run
# on a verification host instead.
#
# The DeskJigShared package suites run separately and faster in
# deskjig-package.yml — this workflow covers only the app-hosted bundle.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Also on main: caches saved in PR runs are scoped to that PR's merge ref,
  # so without a main run every new PR branch starts cold. A run per merge
  # keeps a warm cache on the default branch that all PRs can restore from.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Reused as a release gate (release.yml calls this before building).
  workflow_call:

concurrency:
  group: deskjig-tests-${{ github.ref }}
  cancel-in-progress: true

# The repo default is already read-only; stated here so a future settings
# change can't silently widen this workflow's token.
permissions:
  contents: read

jobs:
  headless-tests:
    name: DeskJigTests (headless plan)
    # FORK GUARD: keeps the workflow from running in forks' own repositories
    # (guarding on the fork bit, not a repo name a rename would silently break).
    # PRs from forks INTO this repo still run (the event's repository is the base).
    if: ${{ !github.event.repository.fork }}
    runs-on: warp-macos-26-arm64-12x
    # Warm runs finish in ~1.5 min and a fully cold build in ~7; the timeout is
    # a paid-minutes bound on a hung runner, not headroom that gets used.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Xcode version
        id: xcode_version
        run: |
          xcode-select -p
          # Capture output first to avoid a broken-pipe crash on Xcode 26.
          XCODE_OUTPUT=$(xcodebuild -version 2>&1 || true)
          echo "$XCODE_OUTPUT"
          VERSION=$(echo "$XCODE_OUTPUT" | head -n1 | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Shallow checkout: the mtime/inode incremental-build machinery is gone
      # (see the compilation-cache comment below), so full history no longer
      # pays for anything.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Two caches, deliberately split. SwiftPM checkouts are pinned out of
      # DerivedData (--cloned-source-packages below) so an edit to either
      # project file rebuilds objects without also throwing away all seven
      # package checkouts — those only churn when Package.resolved does.
      # restore/save are split (instead of plain actions/cache) so the save
      # runs even when the test step fails: a failed run that compiled 90% of
      # a cold cache still leaves the rerun warm — the whole point of caching.
      - name: Restore SwiftPM checkouts cache
        id: cache_spm
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ steps.xcode_version.outputs.version }}-${{ hashFiles('DeskJig.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          # No bare `-spm-` fallback: it could match entries from other cache
          # families in this key namespace; a same-Xcode prefix match is the
          # only restore that is guaranteed to be this workspace's checkouts.
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.xcode_version.outputs.version }}-

      # Xcode 26 compilation cache (CAS), replacing the old DerivedData cache
      # (`-xcode-test-v4-…` family, retired 2026-08-26). DerivedData caching
      # never produced incremental builds here: the Metal toolchain cryptex
      # mounts at a random per-VM path that Xcode bakes into every Swift task
      # signature, so each fresh runner invalidated all ~1,370 compile tasks
      # (diagnosed via manifest diffs in #74). The CAS is content-addressed —
      # compile results are keyed by their actual inputs — so VM identity,
      # mtimes, inodes and that random path stop mattering, and DerivedData is
      # simply rebuilt fresh each run with compiles short-circuiting to cache
      # hits (measured locally: 14 s vs 32 s full build, 100% hit rate
      # including SwiftPM dep targets).
      #
      # The primary key embeds run_id so every run misses it and saves its own
      # snapshot (newly compiled objects accrete); restores take the newest
      # same-Xcode entry via the prefix restore-key. Entries are ~immutable
      # snapshots; stale ones age out with Warp's eviction. Keyed on the Xcode
      # version because CAS contents are toolchain-specific.
      - name: Restore Xcode compilation cache
        id: cache_cas
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-v1-${{ steps.xcode_version.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-xcode-cas-v1-${{ steps.xcode_version.outputs.version }}-

      - name: Cache summary
        env:
          SPM_HIT: ${{ steps.cache_spm.outputs.cache-hit }}
          CAS_MK: ${{ steps.cache_cas.outputs.cache-matched-key }}
        run: |
          # SPM: cache-hit is only true on an exact primary-key match; a
          # restore-key match restores content but reports false. CAS: the
          # primary key embeds run_id so it never exact-hits — the matched-key
          # output says whether a snapshot was restored.
          state() {
            local hit="$1" dir="$2"
            if [[ "$hit" == "true" ]]; then echo "hit"
            elif [[ -d "$dir" && -n "$(ls -A "$dir" 2>/dev/null)" ]]; then echo "partial-hit (restore-key)"
            else echo "miss"
            fi
          }
          # (du || true) so a missing directory on a cold cache doesn't trip
          # the runner shell's pipefail and kill the step.
          SPM_SIZE=$( (du -sh build/SourcePackages 2>/dev/null || true) | cut -f1 )
          CAS_SIZE=$( (du -sh build/DerivedData/CompilationCache.noindex 2>/dev/null || true) | cut -f1 )
          {
            echo "### Cache"
            echo "| cache | state | size |"
            echo "| --- | --- | --- |"
            echo "| SwiftPM checkouts | $(state "$SPM_HIT" build/SourcePackages) | ${SPM_SIZE:-0} |"
            echo "| Compilation cache | $([[ -n "$CAS_MK" ]] && echo "restored ($CAS_MK)" || echo miss) | ${CAS_SIZE:-0} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # WarpBuilds/cache exits green in every failure mode, so the two states
      # that are never legitimate must be caught by hand. An EMPTY
      # cache-primary-key output is the action's unique signature for "bailed
      # before validating inputs" (WARPBUILD_RUNNER_VERIFICATION_TOKEN missing /
      # cache service unreachable) — warn, don't fail: tests are still valid on
      # a cold build. A matched key with a near-empty directory is a poisoned
      # entry — fail hard, and evict the key with cache-evict.yml.
      - name: Cache health guard
        env:
          SPM_PK: ${{ steps.cache_spm.outputs.cache-primary-key }}
          CAS_PK: ${{ steps.cache_cas.outputs.cache-primary-key }}
          CAS_MK: ${{ steps.cache_cas.outputs.cache-matched-key }}
          SPM_MK: ${{ steps.cache_spm.outputs.cache-matched-key }}
        run: |
          if [[ -z "$SPM_PK" || -z "$CAS_PK" ]]; then
            echo "::warning::WarpBuild cache token missing or service unavailable — restores/saves are silently disabled this run (cold build, results still valid)"
          fi
          check_poisoned() { # name dir matched_key floor_kib
            local name="$1" dir="$2" mk="$3" floor="$4" kib
            [[ -z "$mk" ]] && return 0
            kib=$( (du -sk "$dir" 2>/dev/null || echo 0) | cut -f1 )
            if (( kib < floor )); then
              echo "::error::$name restore matched '$mk' but only ${kib} KiB materialized — poisoned entry; evict it via cache-evict.yml"
              return 1
            fi
          }
          # A populated CAS is ~700 MB raw. Per-run keys mean a bad snapshot
          # only hurts until the next save, but a near-empty restore still
          # signals a broken save path worth failing loudly on.
          check_poisoned "Compilation cache" build/DerivedData/CompilationCache.noindex "$CAS_MK" 102400
          # A healthy SourcePackages (7 package checkouts + bare repos +
          # Sparkle's binary artifact) is ~850 MB raw. The original 5 MB floor
          # let a 26 MB partial entry (2 of 7 bare repos, no checkouts) pass
          # for a day while every run silently re-fetched 5 packages (~22 s).
          check_poisoned "SwiftPM checkouts" build/SourcePackages "$SPM_MK" 409600
          if [[ -n "$CAS_PK" && -z "$CAS_MK" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "::warning::Compilation cache miss on main — expected a warm snapshot (cold once after a key bump is normal)"
          fi

      - name: Run headless DeskJigTests plan
        # --no-signing: PR runners have no signing identity; the test host runs
        # with the linker's ad-hoc signature, which is fine for unit tests.
        # Compilation cache: content-addressed compile caching (CAS lands in
        # <derivedDataPath>/CompilationCache.noindex, the directory cached
        # above). LIMIT_SIZE caps on-disk CAS growth; DIAGNOSTIC_REMARKS prints
        # a per-task "cache hit/miss" note into the log so hit rates stay
        # auditable (grep "cache hit").
        run: |
          bun scripts/test-deskjig.ts --plan headless --no-signing \
            --cloned-source-packages build/SourcePackages \
            --build-setting COMPILATION_CACHE_ENABLE_CACHING=YES \
            --build-setting COMPILATION_CACHE_LIMIT_SIZE=2G \
            --build-setting COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES

      # Cache entries are immutable per key: saving an EMPTY or partial
      # directory permanently poisons that key — every later run restores it,
      # skips its save on the "hit", and quietly pays the cost until the entry
      # is evicted (this happened twice: an empty DerivedData in #63, and a
      # 26 MB partial SourcePackages fixed in #75). Only save directories that
      # pass the content bar.
      - name: Check caches have content worth saving
        id: cache_content
        if: always()
        run: |
          nonempty() { [[ -d "$1" && -n "$(ls -A "$1" 2>/dev/null)" ]] && echo true || echo false; }
          # SwiftPM needs more than non-empty: a run that dies mid-resolve
          # leaves a small partial tree (bare repos but no checkouts), and
          # saving it poisons the immutable entry — every later run "hits" it,
          # re-fetches the missing packages from the network, and skips its own
          # save because the hit already exists. Mirror the restore-side floor.
          spm_complete() {
            local kib
            kib=$( (du -sk build/SourcePackages 2>/dev/null || echo 0) | cut -f1 )
            if [[ -d build/SourcePackages/checkouts && -n "$(ls -A build/SourcePackages/checkouts 2>/dev/null)" ]] && (( kib >= 409600 )); then
              echo true
            else
              echo false
            fi
          }
          # CAS: partial content is harmless (content-addressed, accretive,
          # and per-run keys mean no entry is ever "hit" and frozen) — the
          # check only prevents saving an empty directory.
          {
            echo "spm=$(spm_complete)"
            echo "cas=$(nonempty build/DerivedData/CompilationCache.noindex)"
          } >> "$GITHUB_OUTPUT"

      # Saved even when the test step failed (see the restore comment). Skipped
      # on an exact primary-key hit — the entry already exists and is immutable.
      - name: Save SwiftPM checkouts cache
        if: always() && steps.cache_spm.outputs.cache-hit != 'true' && steps.cache_content.outputs.spm == 'true'
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/SourcePackages
          key: ${{ steps.cache_spm.outputs.cache-primary-key }}

      # The run_id primary key never pre-exists, so this saves a fresh CAS
      # snapshot (restored base + this run's newly compiled objects) on every
      # run, keeping the newest prefix match warm for the next run.
      - name: Save Xcode compilation cache
        if: always() && steps.cache_content.outputs.cas == 'true'
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache_cas.outputs.cache-primary-key }}

      # The save action swallows every upload failure (by construction — no
      # input changes that), so verify the entries actually exist. lookup-only
      # skips the download; fail-on-cache-miss turns a vanished save red.
      - name: Verify saved cache entries exist
        if: always() && steps.cache_spm.outputs.cache-hit != 'true' && steps.cache_content.outputs.spm == 'true' && steps.cache_spm.outputs.cache-primary-key != ''
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/SourcePackages
          key: ${{ steps.cache_spm.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Verify saved compilation cache entry exists
        if: always() && steps.cache_content.outputs.cas == 'true' && steps.cache_cas.outputs.cache-primary-key != ''
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache_cas.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskjig-tests-headless-log
          path: build/deskjig-tests.headless.log
          if-no-files-found: ignore

