name: DeskJigShared package

# Builds and tests the DeskJigShared SwiftPM package on its own, with no Xcode
# project, no app host and no code signing. This is the fast lane: it covers the
# bulk of the suite (everything that does not need to run inside DeskJig.app)
# and fails in a couple of minutes when a shared-layer change breaks.
#
# The app-hosted bundle is a separate workflow (deskjig-tests.yml) because it
# needs the whole Xcode project graph built first.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Also on main so the default branch always holds a warm cache for new PR
  # branches to restore from (PR-run caches are scoped to their merge ref).
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Reused as a release gate (release.yml calls this before building).
  workflow_call:

concurrency:
  group: deskjig-package-${{ github.ref }}
  cancel-in-progress: true

# The repo default is already read-only; stated here so a future settings
# change can't silently widen this workflow's token.
permissions:
  contents: read

jobs:
  package:
    name: swift build + swift test
    # FORK GUARD: keeps the workflow from running in forks' own repositories
    # (guarding on the fork bit, not a repo name a rename would silently break).
    # PRs from forks INTO this repo still run (the event's repository is the base).
    if: ${{ !github.event.repository.fork }}
    runs-on: warp-macos-26-arm64-6x
    # Warm runs finish in ~1 min; the timeout bounds paid minutes on a hang.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Swift version
        run: swift --version

      # Keyed on the package manifest and its resolved pins: a dependency bump
      # invalidates the cache, an ordinary source change reuses it.
      - name: Cache SwiftPM build directory
        uses: WarpBuilds/cache@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: DeskJigShared/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('DeskJigShared/Package.resolved') }}-${{ hashFiles('DeskJigShared/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('DeskJigShared/Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Build package
        run: swift build --package-path DeskJigShared

      - name: Test package
        run: swift test --package-path DeskJigShared
