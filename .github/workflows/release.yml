name: Release

# Signed, notarized, Sparkle-ready release of DeskJig.
#
# Trigger: pushing a tag that looks like `v1.2.3`. The tag is the single input —
# the version it carries must match Version.xcconfig or the run fails before
# anything is built (see the gate job).
#
# What it produces, attached to the GitHub Release for the tag:
#   DeskJig-<version>.dmg   notarized + stapled, containing the notarized +
#                           stapled DeskJig.app (with the deskjig CLI embedded at
#                           Contents/Helpers/deskjig)
#   appcast.xml             Sparkle feed, EdDSA-signed enclosure, previous
#                           releases' items merged in
#
# The app's SUFeedURL points at
#   https://github.com/HumidResearch/deskjig/releases/latest/download/appcast.xml
# which GitHub 302-redirects to the newest non-prerelease's appcast.xml asset.
# Sparkle's downloader follows HTTP redirects, so republishing the asset on every
# release keeps a single permanently valid feed URL with no extra hosting.
#
# JOB GRAPH — split so a flake reruns minutes, not the whole release build
# (`gh run rerun --failed` reuses the artifacts of the jobs that passed):
#
#   gate     (ubuntu)  seconds: version/tag/xcconfig/Sparkle-key/build-number gates
#   build    (macOS)   arm64 release build, deep re-sign, verify;
#                      artifacts: the ditto'd app zip + Sparkle's sign_update
#   notarize (macOS)   both notarization rounds, DMG packaging, Gatekeeper;
#                      artifact: the finished DMG
#   publish  (macOS)   Sparkle-sign the DMG, generate appcast, publish release
#
# Seam rules this file must keep:
#   - .app bundles cross artifact boundaries only inside a `ditto -c -k
#     --keepParent --rsrc` zip — upload-artifact alone destroys signatures,
#     symlinks and extended attributes. Re-verify after every extraction, and
#     re-verify the DMG in publish before Sparkle-signing it.
#   - Every upload-artifact sets `overwrite: true` — v4 artifact names are
#     immutable within a run, so without it any rerun that re-executes an
#     upload dies with 409 and the advertised rerun-recovery path is the one
#     path guaranteed to fail.
#   - The signing keychain cannot cross a job boundary: every job that codesigns
#     runs .github/actions/import-signing-cert and deletes its keychain in an
#     always() step.
#   - $RUNNER_TEMP/notary-key.p8 must be re-materialized in the job that
#     notarizes.
#   - sign_update is a build-job product (found in the resolved SwiftPM
#     artifacts); it is exported as its own artifact because the publish job
#     needs it long after the build workspace is gone.
#   - Release builds compile COLD on purpose: no DerivedData cache here. The
#     incremental-build heuristics (mtime restore, inode suppression) that make
#     caching work on the PR lanes are exactly the machinery that could ship a
#     stale object file in a signed, notarized DMG — and with releases weeks
#     apart, GitHub's 7-day cache eviction means the cache would nearly always
#     miss anyway. Only the SwiftPM checkout cache is restored (the PR lanes
#     keep it warm, and package checkouts are inputs, not compiled output).
#
# FORK SAFETY: every job here touches release secrets, so every job is gated on
# `!github.event.repository.fork`. A fork that pushes a tag gets a skipped run,
# not a run that fails halfway through trying to decrypt a certificate it does
# not have. (Guarding on the fork bit rather than a hard-coded repo name means
# a rename or org move cannot silently skip all CI — that bit us once already.)
#
# MANUAL RUNS: `workflow_dispatch` re-runs a release for an existing tag —
# dispatch it ON the tag ref (`gh workflow run release.yml --ref v1.2.3`); a
# branch ref fails the version gate immediately. `dry_run` (default TRUE for
# manual runs) exercises everything expensive and flake-prone — build, deep
# re-sign, both notarizations, DMG, Gatekeeper, appcast generation — and stops
# exactly before the irreversible publish step. The publish step is gated on
# DRY_RUN being exactly 'false', so a malformed expression skips publishing
# instead of firing it. Note the dispatched tag must already contain this
# workflow file (tags cut before it landed cannot be dispatched).
#
# Required repository secrets (created by the maintainer — see docs/RELEASING.md):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password that .p12 was exported with
#   NOTARY_KEY_ID               App Store Connect API key ID
#   NOTARY_ISSUER_ID            App Store Connect API issuer UUID
#   NOTARY_KEY_P8               base64 of the AuthKey_<id>.p8 private key
#   SPARKLE_PRIVATE_KEY         Sparkle EdDSA private key (generate_keys output)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and notarize but do not publish"
        type: boolean
        default: true

# Only `gh release` needs write access; the publish job escalates for itself.
permissions:
  contents: read

concurrency:
  group: deskjig-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MINIMUM_SYSTEM_VERSION: "14.0"

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be decided without building runs on a cheap Linux
  # runner first, so a misconfigured release fails in seconds instead of after
  # a macOS runner spin-up (or worse, a notarization).
  # ---------------------------------------------------------------------------
  gate:
    name: Validate tag, version and feed
    # FORK GUARD — see the header. Keep this on every job.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Resolve version from tag and verify it matches the project
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ref '$TAG' does not look like vMAJOR.MINOR.PATCH[-prerelease]. Manual runs must be dispatched on a release tag ref (gh workflow run release.yml --ref v1.2.3), not a branch."
            exit 1
          fi

          PROJECT_VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*\(.*\)$/\1/p' Version.xcconfig | tr -d '[:space:]')
          BUILD_NUMBER=$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*\(.*\)$/\1/p' Version.xcconfig | tr -d '[:space:]')

          if [[ -z "$PROJECT_VERSION" || -z "$BUILD_NUMBER" ]]; then
            echo "::error::Could not read MARKETING_VERSION / CURRENT_PROJECT_VERSION from Version.xcconfig."
            exit 1
          fi

          if [[ "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag version '$VERSION' does not match MARKETING_VERSION '$PROJECT_VERSION' in Version.xcconfig. Bump the file, commit, and re-tag."
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (build $BUILD_NUMBER) from tag $TAG"

      - name: Verify Sparkle public key is real
        run: |
          set -euo pipefail
          PLIST="DeskJig/Info.plist"
          # No error suppression: a malformed plist must fail THIS step loudly,
          # not masquerade as "the placeholder is still present" below.
          ED_KEY=$(python3 -c "import plistlib; print(plistlib.load(open('$PLIST','rb')).get('SUPublicEDKey',''))")
          FEED=$(python3 -c "import plistlib; print(plistlib.load(open('$PLIST','rb')).get('SUFeedURL',''))")

          if [[ -z "$ED_KEY" || "$ED_KEY" == "REPLACE_WITH_SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::$PLIST still carries the SUPublicEDKey placeholder. Generate the Sparkle keypair (docs/RELEASING.md), commit the PUBLIC half here, and re-tag. Shipping without it would produce updates no installed copy can verify."
            exit 1
          fi

          if [[ -z "$FEED" || "$FEED" == *"example.invalid"* ]]; then
            echo "::error::$PLIST still carries the placeholder SUFeedURL ('$FEED')."
            exit 1
          fi

          echo "Sparkle feed: $FEED"

      - name: Fetch the currently published appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pulled through `gh` rather than the public feed URL so this works
          # while the repo is still private (it flips public with v1.0.0).
          # `gh release download` with no tag resolves the latest NON-prerelease
          # release — matching the public feed URL's semantics. Known limit: on
          # a prerelease train (beta N over beta N-1) this compares against the
          # stable feed only, so beta-over-beta build numbers are not checked.
          #
          # An absent feed is only accepted when NO stable release exists —
          # a transient download failure must not be mistaken for "first
          # release" (regenerating the feed from scratch would silently drop
          # every published item).
          rm -f "$RUNNER_TEMP/appcast-previous.xml"
          STABLE_COUNT=$(gh release list --json isPrerelease --jq '[.[] | select(.isPrerelease | not)] | length')
          if [[ "$STABLE_COUNT" -eq 0 ]]; then
            echo "No stable release yet — starting a new feed."
          elif gh release download --pattern appcast.xml --dir "$RUNNER_TEMP"; then
            mv "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/appcast-previous.xml"
            echo "Previous appcast fetched ($(wc -c < "$RUNNER_TEMP/appcast-previous.xml") bytes)."
          else
            echo "::error::A stable release exists but its appcast.xml could not be downloaded. Refusing to continue — regenerating the feed from scratch would drop every published item."
            exit 1
          fi

      # Version.xcconfig documents that a non-growing build number fails the
      # release; this precheck fires it here, where the fix costs seconds —
      # not inside appcast generation after both notarizations were spent.
      # The full check still runs again at generation time.
      - name: Verify build number grows monotonically
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          if [[ -f "$RUNNER_TEMP/appcast-previous.xml" ]]; then
            PREVIOUS_ARGS=(--previous "$RUNNER_TEMP/appcast-previous.xml")
          fi
          bun run scripts/appcast.ts --precheck \
            --short-version "$VERSION" \
            --build "$BUILD_NUMBER" \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}

  # ---------------------------------------------------------------------------
  # Quality gates: the same test and lint lanes PRs run, invoked here as
  # reusable workflows so a release can never build from a commit whose tests
  # were not green ON THIS REF. Tag pushes do not trigger the PR workflows, so
  # without these calls a hotfix tagged without a PR would ship untested.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    needs: gate
    uses: ./.github/workflows/deskjig-tests.yml

  package:
    name: Package
    needs: gate
    uses: ./.github/workflows/deskjig-package.yml

  lint:
    name: Lint
    needs: gate
    uses: ./.github/workflows/swiftlint.yml

  # ---------------------------------------------------------------------------
  # Universal build + Developer ID signing. Produces the ditto'd app zip and
  # Sparkle's sign_update tool as artifacts. Compiles cold on purpose — see the
  # seam rules in the header.
  # ---------------------------------------------------------------------------
  build:
    name: Build and sign DeskJig.app
    needs: [gate, tests, package, lint]
    if: ${{ !github.event.repository.fork }}
    runs-on: warp-macos-26-arm64-12x
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Xcode version
        id: xcode_version
        run: |
          xcode-select -p
          # Capture output first to avoid a broken-pipe crash on Xcode 26.
          XCODE_OUTPUT=$(xcodebuild -version 2>&1 || true)
          echo "$XCODE_OUTPUT"
          VERSION=$(echo "$XCODE_OUTPUT" | head -n1 | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Same SPM cache family as the PR lanes, which keep it warm. Checkouts
      # are inputs (verified against Package.resolved), not compiled output, so
      # restoring them cannot make the release build stale.
      - name: Cache SwiftPM checkouts
        id: cache_spm
        uses: WarpBuilds/cache@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ steps.xcode_version.outputs.version }}-${{ hashFiles('DeskJig.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.xcode_version.outputs.version }}-
            ${{ runner.os }}-spm-

      - name: Cache summary
        env:
          SPM_HIT: ${{ steps.cache_spm.outputs.cache-hit }}
        run: |
          # (du || true) so a missing directory on a cold cache doesn't trip
          # the runner shell's pipefail and kill the step.
          SPM_SIZE=$( (du -sh build/SourcePackages 2>/dev/null || true) | cut -f1 )
          if [[ "$SPM_HIT" == "true" ]]; then STATE="hit"
          elif [[ -d build/SourcePackages && -n "$(ls -A build/SourcePackages 2>/dev/null)" ]]; then STATE="partial-hit (restore-key)"
          else STATE="miss"
          fi
          echo "SwiftPM checkouts cache: $STATE (${SPM_SIZE:-0})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Import Developer ID certificate
        id: signing
        uses: ./.github/actions/import-signing-cert
        with:
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build DeskJig.app (Release, Developer ID)
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
        run: |
          set -euo pipefail
          # arm64-only on purpose (decided 2026-08-26): no Intel users exist,
          # and dropping the x86_64 slice halves the compile.
          # --timestamp: notarization rejects signatures without a secure
          # timestamp. Hardened runtime is already YES on both the app and the
          # CLI targets, so it does not need forcing here.
          bun run scripts/build-deskjig.ts --target app --release \
            --cloned-source-packages build/SourcePackages \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=$SIGN_IDENTITY" \
            "DEVELOPMENT_TEAM=$TEAM_ID" \
            "OTHER_CODE_SIGN_FLAGS=--timestamp" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # xcodebuild leaves two things notarization rejects (verified empirically
      # on the Studio, 2026-08-25 — submissions 9d8848b7/ee76a20f came back
      # Invalid for exactly these):
      #   1. Sparkle's nested executables (both XPC services, Autoupdate,
      #      Updater.app) keep Sparkle's own signature — no Developer ID, no
      #      secure timestamp.
      #   2. A plain `xcodebuild build` injects com.apple.security.get-task-allow
      #      into the app signature (Xcode's archive-export flow strips it; we
      #      don't archive).
      # Re-sign inside-out with our identity + timestamp, then finalize the app
      # with the explicit, reviewed entitlements allowlist.
      - name: Deep re-sign Sparkle internals and finalize entitlements
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/DeskJig.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"

          for TARGET in \
            "$SPARKLE/XPCServices/Downloader.xpc" \
            "$SPARKLE/XPCServices/Installer.xpc" \
            "$SPARKLE/Autoupdate" \
            "$SPARKLE/Updater.app"
          do
            codesign --force --sign "$SIGN_IDENTITY" --timestamp -o runtime "$TARGET"
          done
          codesign --force --sign "$SIGN_IDENTITY" --timestamp -o runtime "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp -o runtime "$APP/Contents/Helpers/deskjig"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp -o runtime \
            --entitlements DeskJig/DeskJig-Release.entitlements "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::get-task-allow survived the entitlement rewrite."
            exit 1
          fi

      - name: Verify build output
        id: app
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          BUILD_NUMBER: ${{ needs.gate.outputs.build }}
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/DeskJig.app"
          if [[ ! -d "$APP" ]]; then
            echo "::error::Expected app bundle at $APP."
            exit 1
          fi

          # The embedded CLI is a Copy Files phase in the app target; if the
          # phase ever silently stops running, `deskjig` disappears from installs.
          HELPER="$APP/Contents/Helpers/deskjig"
          if [[ ! -x "$HELPER" ]]; then
            echo "::error::Embedded CLI missing or not executable at Contents/Helpers/deskjig."
            ls -la "$APP/Contents" || true
            exit 1
          fi

          APP_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          CLI_VERSION=$("$HELPER" --version | tr -d '[:space:]')

          echo "app CFBundleShortVersionString: $APP_SHORT"
          echo "app CFBundleVersion:            $APP_BUILD"
          echo "deskjig --version:              $CLI_VERSION"

          FAILED=0
          [[ "$APP_SHORT" == "$VERSION" ]]      || { echo "::error::App short version '$APP_SHORT' != tag version '$VERSION'."; FAILED=1; }
          [[ "$APP_BUILD" == "$BUILD_NUMBER" ]] || { echo "::error::App CFBundleVersion '$APP_BUILD' != Version.xcconfig build '$BUILD_NUMBER'."; FAILED=1; }
          [[ "$CLI_VERSION" == "$VERSION" ]]    || { echo "::error::deskjig --version printed '$CLI_VERSION', expected '$VERSION'."; FAILED=1; }
          [[ "$FAILED" -eq 0 ]] || exit 1

          # Signature sanity before anything downstream is spent on it.
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier|Identifier)=" || true
          codesign --verify --strict --verbose=2 "$HELPER"

          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      # upload-artifact does not preserve code signatures, symlinks or extended
      # attributes — the .app crosses the job boundary only inside a ditto zip.
      - name: Stage artifacts
        env:
          APP: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage" "$RUNNER_TEMP/stage-tools"
          ditto -c -k --keepParent --rsrc "$APP" "$RUNNER_TEMP/stage/DeskJig.app.zip"

          # sign_update ships inside Sparkle's own SwiftPM artifact bundle, which
          # the app build resolved into build/SourcePackages. Exporting it here
          # (instead of the publish job downloading a release tarball) guarantees
          # the signing tool and the linked framework are the exact same Sparkle
          # version. The publish job restores its executable bit after download.
          ARTIFACTS_DIR="build/SourcePackages/artifacts"
          if [[ ! -d "$ARTIFACTS_DIR" ]]; then
            echo "::error::$ARTIFACTS_DIR does not exist — SwiftPM did not resolve any binary artifact bundles."
            ls build/SourcePackages || true
            exit 1
          fi
          # Exactly one match, pinned to Sparkle's EdDSA tool at bin/sign_update.
          # Two reasons for the strictness: the bundle ALSO ships a legacy DSA
          # script at bin/old_dsa_scripts/sign_update (signing the feed with
          # that would be garbage — the old "first find hit wins" logic was one
          # traversal-order change away from doing it), and a restore-key cache
          # hit could leave a second, stale copy lying around.
          # (-not -path …/extract/…: SwiftPM keeps a transient extraction
          # staging tree that can hold a second copy of the whole bundle.)
          MATCHES=$(find "$ARTIFACTS_DIR" -type f -perm -u+x -path "*/Sparkle/bin/sign_update" -not -path "*/extract/*" | sort)
          COUNT=$(printf '%s' "$MATCHES" | grep -c . || true)
          if [[ "$COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one Sparkle sign_update under $ARTIFACTS_DIR, found $COUNT."
            printf '%s\n' "$MATCHES"
            find "$ARTIFACTS_DIR" -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Exporting $MATCHES"
          cp "$MATCHES" "$RUNNER_TEMP/stage-tools/sign_update"

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskjig-app
          path: ${{ runner.temp }}/stage/DeskJig.app.zip
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Upload Sparkle sign_update artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkle-sign-update
          path: ${{ runner.temp }}/stage-tools/sign_update
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Clean up signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" || true
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskjig-release-build-log
          path: build/deskjig-build.app.log
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------------
  # Notarize the app, then the DMG that carries it. Two rounds, deliberately:
  # stapling the app makes Gatekeeper accept it offline once it has been
  # dragged out of the disk image, and stapling the DMG does the same for the
  # image itself. Notarizing only the DMG leaves the extracted app dependent
  # on an online Gatekeeper check.
  #
  # The two notarytool waits are wall-clock-bound with zero CPU and strictly
  # serial (the DMG must contain the already-stapled app). Isolating them means
  # an Apple-side flake reruns ~2 minutes of work, not the release build.
  # ---------------------------------------------------------------------------
  notarize:
    name: Notarize app, package and notarize DMG
    needs: [gate, build]
    if: ${{ !github.event.repository.fork }}
    runs-on: warp-macos-26-arm64-6x
    # Two notarytool submissions at --timeout 45m each, plus packaging,
    # stapling and Gatekeeper overhead — real headroom over the 45+45 cap.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      # Checkout exists only so the local composite action below is available;
      # everything this job operates on comes from the build artifact.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deskjig-app
          path: ${{ runner.temp }}/incoming

      - name: Extract and verify the signed app
        id: app
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/app"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          ditto -x -k "$RUNNER_TEMP/incoming/DeskJig.app.zip" "$WORK"
          APP="$WORK/DeskJig.app"
          if [[ ! -d "$APP" ]]; then
            echo "::error::DeskJig.app missing after extraction."
            ls -la "$WORK" || true
            exit 1
          fi

          # Signature-destroying artifact transfer is the single most likely way
          # a job split breaks. Fail here, in seconds, not at Gatekeeper.
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [[ ! -L "$APP/Contents/Frameworks/Sparkle.framework/Versions/Current" ]]; then
            echo "::error::Sparkle.framework/Versions/Current is no longer a symlink — the artifact transfer flattened the bundle."
            exit 1
          fi

          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      # The signing keychain cannot cross a job boundary; re-import for the DMG
      # signature.
      - name: Import Developer ID certificate
        id: signing
        uses: ./.github/actions/import-signing-cert
        with:
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Write notarization API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "${NOTARY_KEY_P8:-}" ]]; then
            echo "::error::Secret NOTARY_KEY_P8 is not set."
            exit 1
          fi
          echo -n "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"

      - name: Notarize and staple DeskJig.app
        env:
          APP: ${{ steps.app.outputs.app_path }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/DeskJig-notarize.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --timeout 45m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package DMG
        id: dmg
        env:
          APP: ${{ steps.app.outputs.app_path }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # hdiutil rather than create-dmg: no Homebrew install, no cask, and the
          # only layout DeskJig needs is "app plus an Applications symlink".
          STAGE="$RUNNER_TEMP/dmg-root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/DeskJig.app"
          ln -s /Applications "$STAGE/Applications"

          mkdir -p "$RUNNER_TEMP/dist"
          DMG="$RUNNER_TEMP/dist/DeskJig-$VERSION.dmg"
          rm -f "$DMG"
          hdiutil create \
            -volname "DeskJig $VERSION" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$DMG"

          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and staple the DMG
        env:
          DMG: ${{ steps.dmg.outputs.dmg_path }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          codesign --sign "$SIGN_IDENTITY" --timestamp --force "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --timeout 45m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Gatekeeper assessment
        env:
          APP: ${{ steps.app.outputs.app_path }}
          DMG: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail
          # This is the check a user's Mac performs on first launch.
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      # A DMG is a flat, signature-embedded file — it crosses the artifact
      # boundary as-is, no ditto zip needed (publish still re-verifies it).
      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskjig-dmg
          path: ${{ runner.temp }}/dist/DeskJig-${{ needs.gate.outputs.version }}.dmg
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Clean up signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12" || true
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ---------------------------------------------------------------------------
  # Sparkle-sign the DMG, generate the appcast, publish the GitHub Release.
  # macOS runner: sign_update is a Mach-O binary.
  # ---------------------------------------------------------------------------
  publish:
    name: Sparkle feed and GitHub Release
    needs: [gate, notarize]
    if: ${{ !github.event.repository.fork }}
    runs-on: warp-macos-26-arm64-6x
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # 'true' only for a manual dispatch that kept the dry_run default on;
      # tag pushes always publish. The publish steps require the literal value
      # 'false' (not merely "not true"), so a malformed expression fails
      # CLOSED: both the dry-run summary and the publish steps skip, which is
      # visible in the run, instead of an accidental publish.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      DMG: dist/DeskJig-${{ needs.gate.outputs.version }}.dmg
    defaults:
      run:
        shell: bash

    steps:
      # Needed for scripts/appcast.ts and release_notes/.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Download DMG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deskjig-dmg
          path: dist

      - name: Download Sparkle sign_update artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkle-sign-update
          path: ${{ runner.temp }}/tools

      # Seam rule: re-verify after every artifact transfer. This DMG is about
      # to be EdDSA-signed byte-for-byte and served to every install — a
      # corrupted download must die here, not on users' machines.
      - name: Verify the downloaded DMG
        run: |
          set -euo pipefail
          if [[ ! -f "$DMG" ]]; then
            echo "::error::Expected DMG at $DMG."
            ls -la dist || true
            exit 1
          fi
          codesign --verify --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"

      - name: Sign the DMG for Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY is not set."
            exit 1
          fi

          # Artifact transfer drops the executable bit; restore it.
          SIGN_UPDATE="$RUNNER_TEMP/tools/sign_update"
          chmod +x "$SIGN_UPDATE"

          KEY_FILE="$RUNNER_TEMP/sparkle-ed-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Prints: sparkle:edSignature="…" length="…"
          OUTPUT=$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "$DMG")
          rm -f "$KEY_FILE"

          SIGNATURE=$(echo "$OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          if [[ -z "$SIGNATURE" || -z "$LENGTH" ]]; then
            echo "::error::Could not parse sign_update output."
            exit 1
          fi

          # The signature itself is not secret (the public key verifies it), but
          # masking keeps the raw private-key-adjacent output out of the log.
          {
            echo "signature=$SIGNATURE"
            echo "length=$LENGTH"
          } >> "$GITHUB_OUTPUT"
          echo "Signed DMG: $LENGTH bytes"

      - name: Fetch the currently published appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same fetch and failure policy as the gate job — repeated because
          # jobs can be hours apart on a rerun and the feed must be merged
          # against what is published NOW, not what was published when the
          # gates ran.
          rm -f "$RUNNER_TEMP/appcast-previous.xml"
          STABLE_COUNT=$(gh release list --json isPrerelease --jq '[.[] | select(.isPrerelease | not)] | length')
          if [[ "$STABLE_COUNT" -eq 0 ]]; then
            echo "No stable release yet — starting a new feed."
          elif gh release download --pattern appcast.xml --dir "$RUNNER_TEMP"; then
            mv "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/appcast-previous.xml"
            echo "Previous appcast fetched ($(wc -c < "$RUNNER_TEMP/appcast-previous.xml") bytes)."
          else
            echo "::error::A stable release exists but its appcast.xml could not be downloaded. Refusing to continue — regenerating the feed from scratch would drop every published item."
            exit 1
          fi

      - name: Generate appcast.xml
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          BUILD_NUMBER: ${{ needs.gate.outputs.build }}
          TAG: ${{ needs.gate.outputs.tag }}
          SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          LENGTH: ${{ steps.sparkle.outputs.length }}
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          if [[ -f "$RUNNER_TEMP/appcast-previous.xml" ]]; then
            PREVIOUS_ARGS=(--previous "$RUNNER_TEMP/appcast-previous.xml")
          fi

          NOTES_ARGS=()
          if [[ -f "release_notes/$TAG.md" ]]; then
            NOTES_ARGS=(--release-notes-file "release_notes/$TAG.md")
          fi

          bun run scripts/appcast.ts \
            --short-version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DeskJig-${VERSION}.dmg" \
            --signature "$SIGNATURE" \
            --length "$LENGTH" \
            --minimum-system-version "$MINIMUM_SYSTEM_VERSION" \
            --output dist/appcast.xml \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"} \
            ${NOTES_ARGS[@]+"${NOTES_ARGS[@]}"}

          cat dist/appcast.xml

      - name: Dry run — stop before publish
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run — nothing published"
            echo ""
            echo "Everything up to (and including) appcast generation succeeded for **$VERSION** ($TAG)."
            echo ""
            echo "- DMG: \`$DMG\` ($(du -h "$DMG" | cut -f1)), notarized + stapled, Gatekeeper-assessed"
            echo "- appcast: \`dist/appcast.xml\` generated and build-number-checked"
            echo ""
            echo "Re-dispatch with dry_run unchecked to publish."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Fail-closed: requires DRY_RUN to be exactly 'false', so a malformed
      # expression can never publish by accident (see the job env comment).
      - name: Publish GitHub Release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # A tag carrying a prerelease suffix must not become "latest" — the
          # appcast feed URL resolves through /releases/latest/.
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          NOTES_ARGS=(--generate-notes)
          if [[ -f "release_notes/$TAG.md" ]]; then
            NOTES_ARGS=(--notes-file "release_notes/$TAG.md")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" dist/appcast.xml --clobber
          else
            gh release create "$TAG" "$DMG" dist/appcast.xml \
              --title "DeskJig $VERSION" \
              ${NOTES_ARGS[@]+"${NOTES_ARGS[@]}"} \
              ${PRERELEASE_ARGS[@]+"${PRERELEASE_ARGS[@]}"}
          fi

          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Verify the public feed URL resolves
        if: env.DRY_RUN == 'false'
        continue-on-error: true
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -uo pipefail
          # This is the exact URL in Info.plist's SUFeedURL. It 302-redirects to
          # the newest non-prerelease's asset; -L follows it the way Sparkle's
          # downloader does. Advisory only: the redirect is anonymous, so it
          # legitimately 404s while the repository is still private, and a
          # freshly published release can take a moment to become "latest".
          FEED="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          if curl -fsSL "$FEED" -o "$RUNNER_TEMP/appcast-live.xml"; then
            if grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "$RUNNER_TEMP/appcast-live.xml"; then
              echo "Feed serves $VERSION at $FEED"
            else
              echo "::warning::$FEED resolved but does not yet list $VERSION."
            fi
          else
            echo "::warning::$FEED is not publicly reachable (expected while the repository is private)."
          fi

      - name: Notify bentodesktop.com of the new release
        # Real publishes only — a dry-run must never move the public site.
        # Advisory: the site's badge and download CTA live-fetch
        # releases/latest anyway; this dispatch only bumps the pinned no-JS
        # fallback (mscontrol-ai/web's Update Download Links workflow), so a
        # missing token or failed call should not fail a published release.
        if: env.DRY_RUN == 'false'
        continue-on-error: true
        env:
          WEB_DISPATCH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$WEB_DISPATCH_TOKEN" ]]; then
            echo "::warning::WEB_DISPATCH_TOKEN is not set — skipping the website notification. Add a fine-grained PAT with contents:write on mscontrol-ai/web to enable it."
            exit 0
          fi
          GH_TOKEN="$WEB_DISPATCH_TOKEN" gh api repos/mscontrol-ai/web/dispatches \
            --method POST \
            --field event_type="release_published" \
            --field client_payload[tag_name]="$TAG" \
            --field client_payload[version]="$VERSION" \
            --field client_payload[dmg_name]="DeskJig-${VERSION}.dmg" \
            --field client_payload[github_url]="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DeskJig-${VERSION}.dmg"
          echo "Notified mscontrol-ai/web to bump its pinned fallback to ${TAG}."

      - name: Clean up Sparkle key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-ed-key" || true
