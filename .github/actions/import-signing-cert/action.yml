name: Import Developer ID certificate
description: >
  Creates an ephemeral keychain in RUNNER_TEMP and imports the Developer ID
  Application certificate into it. Used by every release job that codesigns —
  keychains cannot cross a job boundary, so each job re-imports, but the
  procedure itself lives here exactly once. Callers must pair this with an
  `if: always()` cleanup step that deletes the keychain named by the
  `keychain` output (composite steps cannot carry always() themselves).

inputs:
  certificate-p12:
    description: base64 of the Developer ID Application .p12
    required: true
  certificate-password:
    description: password the .p12 was exported with
    required: true

outputs:
  identity:
    description: 'Full "Developer ID Application: … (TEAMID)" identity string'
    value: ${{ steps.import.outputs.identity }}
  team_id:
    description: The Team ID parsed out of the identity
    value: ${{ steps.import.outputs.team_id }}
  keychain:
    description: Path of the ephemeral keychain (delete in an always() step)
    value: ${{ steps.import.outputs.keychain }}

runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        MACOS_CERTIFICATE_P12: ${{ inputs.certificate-p12 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        if [[ -z "${MACOS_CERTIFICATE_P12:-}" ]]; then
          echo "::error::Secret MACOS_CERTIFICATE_P12 is not set."
          exit 1
        fi

        CERT_PATH="$RUNNER_TEMP/developer-id.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/deskjig-release.keychain-db"
        # Ephemeral keychain password: the keychain dies with the runner.
        KEYCHAIN_PASSWORD=$(uuidgen)

        echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        # Without this, codesign blocks on a GUI "allow access" prompt no one
        # can answer on a headless runner.
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
        rm -f "$CERT_PATH"

        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
          | grep "Developer ID Application" \
          | head -n1 \
          | sed -n 's/.*"\(.*\)"$/\1/p')

        if [[ -z "$IDENTITY" ]]; then
          echo "::error::No 'Developer ID Application' identity found in the imported certificate."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi

        # "Developer ID Application: Some Name (TEAMID)" -> TEAMID
        TEAM_ID=$(echo "$IDENTITY" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')
        if [[ -z "$TEAM_ID" ]]; then
          echo "::error::Could not parse a Team ID out of identity '$IDENTITY'."
          exit 1
        fi

        {
          echo "identity=$IDENTITY"
          echo "team_id=$TEAM_ID"
          echo "keychain=$KEYCHAIN_PATH"
        } >> "$GITHUB_OUTPUT"
        echo "Signing as: $IDENTITY (team $TEAM_ID)"
